<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JØXTV Pre Stream</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>
<div class="particles"></div>


<div class="overlay">


    <!-- HEADER -->

    <header class="top-bar">

        <div class="brand">
            <span class="logo">JØXTV</span>
            <span class="status">
                PRE STREAM SYSTEM
            </span>
        </div>


        <div class="online">
            <span class="dot"></span>
            SYSTEM ONLINE
        </div>

    </header>




    <!-- MAIN -->

    <main class="layout">


        <!-- CAMERA -->

        <section class="camera glass">


            <div class="hud-title">
                CAM_01 // LIVING ROOM
            </div>


            <div class="camera-center">

                <div class="cam-icon">
                    ◉
                </div>

                <h1>
                    STARTING SOON
                </h1>

                <p>
                    Preparing stream...
                </p>

            </div>


            <div class="camera-footer">

                SIGNAL:
                <span>
                    ONLINE
                </span>

            </div>


        </section>





        <!-- CHAT -->

        <section class="chat glass">


            <div class="section-title">
                💬 LIVE CHAT
            </div>


            <div id="chatMessages">

                <div class="message">
                    <b>System</b>
                    Waiting for viewers...
                </div>


            </div>


        </section>



    </main>






    <!-- MUSIC -->

    <section class="music glass">


        <div class="music-info">


            <div class="cover">
                ♪
            </div>


            <div>

                <div class="song">
                    No Song Playing
                </div>

                <div class="artist">
                    Waiting...
                </div>


            </div>


        </div>



        <div class="equalizer">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


    </section>



</div>



<script src="script.js"></script>


</body>

</html>
