<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Pre-Stream Overlay</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Arial', sans-serif;
}

body {
  width: 1920px;
  height: 1080px;
  background: radial-gradient(circle at top, #0f0f0f, #050505);
  overflow: hidden;
  color: white;
}

/* GRID BASE */
.container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-template-rows: 1fr 200px;
  gap: 20px;
  padding: 30px;
  height: 100%;
}

/* ZONA VIDEO / CAM */
.cam-zone {
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  position: relative;
  background: rgba(255,255,255,0.02);
  backdrop-filter: blur(10px);
}

.cam-label {
  position: absolute;
  top: 15px;
  left: 20px;
  font-size: 18px;
  opacity: 0.6;
  letter-spacing: 2px;
}

/* CHAT */
.chat-box {
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 15px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
}

.chat-title {
  font-size: 16px;
  margin-bottom: 10px;
  opacity: 0.7;
}

.chat-content {
  flex: 1;
  overflow: hidden;
  font-size: 14px;
  opacity: 0.8;
}

/* MUSICA */
.music-box {
  grid-column: span 2;
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 20px;
  background: rgba(255,255,255,0.03);
  backdrop-filter: blur(10px);

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.song-info {
  display: flex;
  flex-direction: column;
}

.song-title {
  font-size: 20px;
  font-weight: bold;
}

.song-artist {
  font-size: 14px;
  opacity: 0.6;
}

/* ANIMAZIONE PULSE */
.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  background: rgba(0, 255, 200, 0.08);
  filter: blur(120px);
  top: -50px;
  left: -50px;
  animation: moveGlow 10s infinite alternate;
}

@keyframes moveGlow {
  0% { transform: translate(0,0); }
  100% { transform: translate(200px,100px); }
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="container">

  <!-- CAM / VIDEO -->
  <div class="cam-zone">
    <div class="cam-label">STREAM STARTING</div>
  </div>

  <!-- CHAT -->
  <div class="chat-box">
    <div class="chat-title">LIVE CHAT</div>
    <div class="chat-content">
      Qui poi colleghi StreamElements / TikTok chat
    </div>
  </div>

  <!-- MUSICA -->
  <div class="music-box">
    <div class="song-info">
      <div class="song-title">Titolo Canzone</div>
      <div class="song-artist">Artista</div>
    </div>

    <div class="song-time">00:00</div>
  </div>

</div>

</body>
</html>
