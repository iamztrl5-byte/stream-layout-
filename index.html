<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JØXTV Background</title>


<style>


* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html, body {

    width:100%;
    height:100%;

    overflow:hidden;

    background:#050505;

}



/* ==========================
   BASE BACKGROUND
========================== */


.background {


    position:absolute;

    inset:0;


    background:

    radial-gradient(
        circle at 20% 20%,
        rgba(168,85,247,.35),
        transparent 35%
    ),

    radial-gradient(
        circle at 80% 70%,
        rgba(124,58,237,.3),
        transparent 40%
    ),

    radial-gradient(
        circle at 50% 50%,
        rgba(236,72,153,.12),
        transparent 50%
    ),

    #030303;



    animation:

    backgroundMove 15s infinite alternate ease-in-out;


}



@keyframes backgroundMove {


    0% {

        transform:scale(1);

        filter:
        hue-rotate(0deg);

    }


    100% {

        transform:scale(1.15);

        filter:
        hue-rotate(25deg);

    }


}





/* ==========================
   GLOW ORBS
========================== */


.orb {


    position:absolute;

    border-radius:50%;

    filter:blur(100px);


}




.orb.one {


    width:500px;

    height:500px;


    background:#a855f7;


    top:-200px;

    left:-150px;


    opacity:.25;


    animation:

    moveOne 12s infinite alternate;


}




.orb.two {


    width:600px;

    height:600px;


    background:#ec4899;


    bottom:-250px;

    right:-200px;


    opacity:.18;


    animation:

    moveTwo 15s infinite alternate;


}




@keyframes moveOne {


    from {

        transform:
        translate(0,0);

    }


    to {

        transform:
        translate(350px,250px);

    }


}




@keyframes moveTwo {


    from {

        transform:
        translate(0,0);

    }


    to {

        transform:
        translate(-300px,-200px);

    }


}





/* ==========================
   CYBER GRID
========================== */


.grid {


    position:absolute;

    inset:0;


    background-image:


    linear-gradient(
        rgba(255,255,255,.025) 1px,
        transparent 1px
    ),


    linear-gradient(
        90deg,
        rgba(255,255,255,.025) 1px,
        transparent 1px
    );


    background-size:

    50px 50px;


    animation:

    gridMove 20s linear infinite;


}




@keyframes gridMove {


    from {

        transform:
        translate(0,0);

    }


    to {

        transform:
        translate(50px,50px);

    }


}





/* ==========================
   PARTICELLE
========================== */


.particles {


    position:absolute;

    inset:0;

}



.particles span {


    position:absolute;


    width:3px;

    height:3px;


    background:#d8b4fe;


    border-radius:50%;


    box-shadow:

    0 0 15px #c084fc;


    animation:

    float 10s infinite linear;


}



@keyframes float {


    from {

        transform:
        translateY(100vh);

        opacity:0;

    }


    20% {

        opacity:1;

    }


    100% {

        transform:
        translateY(-20vh);

        opacity:0;

    }


}





/* ==========================
   SCANLINES
========================== */


.scan {


    position:absolute;

    inset:0;


    background:

    repeating-linear-gradient(

        0deg,

        rgba(255,255,255,.025),

        rgba(255,255,255,.025) 1px,

        transparent 3px,

        transparent 6px

    );



    pointer-events:none;

}




</style>

</head>



<body>


<div class="background"></div>

<div class="orb one"></div>

<div class="orb two"></div>


<div class="grid"></div>


<div class="particles">

<span style="left:10%;animation-delay:0s"></span>
<span style="left:20%;animation-delay:2s"></span>
<span style="left:35%;animation-delay:5s"></span>
<span style="left:50%;animation-delay:1s"></span>
<span style="left:65%;animation-delay:4s"></span>
<span style="left:80%;animation-delay:7s"></span>
<span style="left:90%;animation-delay:3s"></span>

</div>


<div class="scan"></div>


</body>


</html>
